<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인쇄 모니터 — 프린트대</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supa.js"></script>
<style>
  :root{ --bg:#0f1115; --card:#171a21; --line:#262b36; --ink:#e7eaf0; --dim:#9aa3b2;
         --pend:#c9a227; --print:#2f7de0; --done:#2e9e5b; --err:#d9484b; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,'Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); }
  header{ display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1{ font-size:18px; margin:0; }
  header .sp{ flex:1; }
  button{ font:inherit; border:1px solid var(--line); background:#1f2530; color:var(--ink); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover{ border-color:#3a4150; }
  button.primary{ background:var(--print); border-color:var(--print); color:#fff; }
  .muted{ color:var(--dim); font-size:13px; }
  .wrap{ padding:16px 20px; }
  .stations{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .st{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px; }
  .st b{ color:#fff; }
  .st.live{ border-color:var(--done); }
  .st.total{ border-color:var(--print); font-size:14px; }
  .st.total b{ font-size:17px; }
  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  th{ color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  tr:last-child td{ border-bottom:none; }
  .tk{ font-weight:800; font-size:16px; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.pending{ background:rgba(201,162,39,.16); color:var(--pend); }
  .badge.printing{ background:rgba(47,125,224,.16); color:var(--print); }
  .badge.done{ background:rgba(46,158,91,.16); color:var(--done); }
  .badge.error{ background:rgba(217,72,75,.18); color:var(--err); }
  .dev{ font-weight:700; }
  .prof{ color:var(--dim); font-size:13px; max-width:340px; }
  .err{ color:var(--err); font-size:12px; }
  .empty{ padding:48px; text-align:center; color:var(--dim); }
  .login{ max-width:360px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; text-align:center; }
  .login h2{ margin:0 0 6px; } .login p{ color:var(--dim); }
  .row-actions{ display:flex; gap:6px; }
</style>
</head>
<body>
<header>
  <h1>🖨️ 인쇄 모니터</h1>
  <span class="muted" id="conn">연결 확인 중…</span>
  <span class="sp"></span>
  <label class="muted"><input type="checkbox" id="auto" checked> 백업 새로고침(5초)</label>
  <button id="refresh">새로고침</button>
  <button id="login" class="primary" style="display:none">로그인</button>
</header>

<div id="gate" class="login" style="display:none">
  <h2>프린트대 모니터</h2>
  <p>관리자 로그인이 필요합니다.<br>(큐레이션과 동일한 Supabase 계정)</p>
  <button class="primary" onclick="doLogin()">로그인하기</button>
</div>

<div class="wrap" id="board" style="display:none">
  <div class="stations" id="summary"></div>
  <div class="stations" id="stations"></div>
  <table>
    <thead><tr>
      <th>번호</th><th>태블릿</th><th>시험</th><th>프로필</th><th>상태</th><th>스테이션</th><th>시각</th><th></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="empty">불러오는 중…</td></tr></tbody>
  </table>
  <p class="muted" style="margin-top:12px">대기/오류 작업은 <b>재인쇄</b>로 큐에 다시 올립니다 → 프린트대 컴퓨터(에이전트)가 받아 출력합니다.</p>
</div>

<script>
const supa = window.supa;
const $ = (id) => document.getElementById(id);

function fmtTime(s){
  if(!s) return '—';
  const d = new Date(s); const p=(n)=>String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function profile(answers){
  try{
    if(!Array.isArray(answers)) return '';
    const labels = answers.map(slot => Array.isArray(slot) ? slot.map(x=>x.label||x.tagId).join('·') : '')
                          .filter(Boolean);
    return labels.slice(0,5).join(' / ');
  }catch(e){ return ''; }
}

async function checkAuth(){
  if(!supa){ $('conn').textContent = 'Supabase 미연결 (supa.js 키 확인)'; return false; }
  const { data:{ session } } = await supa.auth.getSession();
  return !!session;
}
async function doLogin(){
  if(!supa){ alert('Supabase 미연결'); return; }
  const email = prompt('관리자 이메일'); if(!email) return;
  const pw = prompt('비밀번호'); if(!pw) return;
  const { error } = await supa.auth.signInWithPassword({ email: email.trim(), password: pw });
  if(error){ alert('로그인 실패: ' + error.message); return; }
  enterBoard();
}

async function loadStations(){
  const { data } = await supa.from('stations').select('*');
  const now = Date.now();
  $('stations').innerHTML = (data||[]).map(s=>{
    const live = s.last_seen && (now - new Date(s.last_seen).getTime() < 15000);
    return `<div class="st ${live?'live':''}">스테이션 <b>${s.id}</b> · ${live?'🟢 가동':'⚪ 대기'} · ${fmtTime(s.last_seen)}${s.busy_job?` · 작업#${s.busy_job}`:''}</div>`;
  }).join('') || '<div class="st">스테이션 heartbeat 없음 (print_agent 미실행)</div>';
}

// 참여 집계: 총 출력 건수 + 기기별 건수 (오늘 하루 행사 기준)
async function loadStats(){
  const { data, error } = await supa.from('print_jobs').select('device').limit(10000);
  if(error){ $('summary').innerHTML = ''; return; }
  const total = data.length; const by = {};
  data.forEach(r => { const d = r.device || '미상'; by[d] = (by[d]||0) + 1; });
  const chips = Object.keys(by).sort().map(d => `<div class="st">기기 <b>${esc(d)}</b> · ${by[d]}명</div>`).join('');
  $('summary').innerHTML = `<div class="st total">📊 총 참여 <b>${total}</b>명</div>` + chips;
}

async function loadJobs(){
  const { data, error } = await supa.from('print_jobs')
    .select('*').order('created_at',{ascending:false}).limit(60);
  if(error){ $('rows').innerHTML = `<tr><td colspan="8" class="empty">읽기 오류: ${error.message}</td></tr>`; return; }
  if(!data.length){ $('rows').innerHTML = '<tr><td colspan="8" class="empty">아직 인쇄 요청이 없습니다.</td></tr>'; return; }
  const st = { pending:'대기', printing:'인쇄중', done:'완료', error:'오류' };
  $('rows').innerHTML = data.map(j=>`
    <tr>
      <td class="tk">${esc(label(j))}</td>
      <td class="dev">${j.device ? esc(j.device) : '<span class="muted">미상</span>'}</td>
      <td>${esc(j.exam||'')}</td>
      <td class="prof">${esc(profile(j.answers))}${j.error?`<div class="err">⚠ ${esc(j.error)}</div>`:''}</td>
      <td><span class="badge ${j.status}">${st[j.status]||j.status}</span></td>
      <td>${esc(j.station||'—')}</td>
      <td class="muted">${fmtTime(j.created_at)}</td>
      <td class="row-actions">${(j.status==='error'||j.status==='done'||j.status==='pending')
        ? `<button onclick="reprint(${j.id})">${j.status==='done'?'재인쇄':'다시 출력'}</button>`:''}</td>
    </tr>`).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// 기기별 라벨(C-3). 기기/순번 없으면 전체 출력번호(#ticket) 폴백.
function label(j){ return (j.device && j.device_seq!=null) ? `${j.device}-${j.device_seq}` : `#${j.ticket ?? '—'}`; }

async function reprint(id){
  const { error } = await supa.rpc('requeue_job', { p_id: id });
  if(error){ alert('재인쇄 실패: ' + error.message); return; }
  refresh();
}

async function refresh(){ if(!supa) return; await Promise.all([loadStations(), loadJobs(), loadStats()]); }

// ── 실시간 구독: print_jobs/stations 변경 시 즉시 반영 (폴링 대신) ──
//   ⚠ Supabase 대시보드에서 두 테이블을 realtime publication에 넣어야 이벤트가 옴.
//     supabase/migration_realtime.sql 참고.
let chan=null;
function startRealtime(){
  if(chan || !supa) return;
  chan = supa.channel('print-monitor')
    .on('postgres_changes', {event:'*', schema:'public', table:'print_jobs'}, ()=>{ loadJobs(); loadStats(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'stations'},   loadStations)
    .subscribe((status)=>{
      $('conn').textContent = (status==='SUBSCRIBED') ? '🟢 실시간 연결됨'
        : (status==='CHANNEL_ERROR'||status==='TIMED_OUT') ? '⚠ 실시간 끊김(백업 폴링 중)'
        : '실시간 연결 중…';
    });
}
function stopRealtime(){ if(chan){ supa.removeChannel(chan); chan=null; } }

// ── 백업 폴링: 실시간이 끊겨도 갱신되도록 + 스테이션 생존표시(🟢/⚪)는
//   DB 이벤트 없이 시간만으로 바뀌므로 주기적 재평가가 항상 필요 ──
let timer=null;
function startPoll(){ stopPoll(); if($('auto').checked) timer=setInterval(refresh, 5000); }
function stopPoll(){ if(timer){ clearInterval(timer); timer=null; } }

function enterBoard(){
  $('gate').style.display='none'; $('board').style.display='block';
  $('login').style.display='none'; $('conn').textContent='연결 중…';
  refresh(); startRealtime(); startPoll();
}

$('refresh').onclick = refresh;
$('login').onclick = doLogin;
$('auto').onchange = startPoll;

(async function init(){
  if(!supa){ $('conn').textContent='Supabase 미연결'; return; }
  if(await checkAuth()) enterBoard();
  else { $('gate').style.display='block'; $('login').style.display='inline-block'; $('conn').textContent='로그인 필요'; }
})();
</script>
</body>
</html>
